<!DOCTYPE html>
<html>
<head>
    <title>Document</title>
</head>
<body>
   <input id="num1">
   <input id="num2" >
   <p id="result"></p>
   <button onclick="result()">add</button>

   <script>

        var para=document.getElementById("result");

    function result(){
                var num1=Number(document.getElementById("num1").value);
                var num2=Number(document.getElementById("num2").value);

           para.innerText="Total:"+ (num1+num2);
    }

   </script>
</body>
